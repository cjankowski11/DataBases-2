services:
  db:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d appdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # new database for testing
  db_test:
    image: postgres:16-alpine
    container_name: postgres_test_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: gym_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d gym_test"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  backend_tests:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fastapi_tests
    environment:
      TEST_DATABASE_URL: postgresql+asyncpg://admin:secret@db_test:5432/gym_test
      DATABASE_URL: postgresql+asyncpg://admin:secret@db_test:5432/gym_test
    depends_on:
      db_test:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: pytest -v
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
